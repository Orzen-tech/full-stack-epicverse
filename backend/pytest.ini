[pytest]
# Only the isolated suite in tests/ is ever collected. The test_*.py scripts in
# this folder and in scripts/ talk to LIVE services (real databases, the Cloud
# Run backend, OpenAI, GCP) and must never be run as part of this suite.
testpaths = tests
asyncio_mode = auto
# One event loop for the whole session: the app keeps a module-level asyncpg
# pool, which is bound to the loop that created it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
